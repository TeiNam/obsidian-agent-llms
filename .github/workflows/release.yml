name: Release Obsidian Plugin

on:
  push:
    branches:
      - main
    # 문서·릴리스 설정만 바뀌면 기존 배포 버전을 유지한다. 필요하면 수동 실행한다.
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: "릴리즈 대상 브랜치"
        required: true
        type: choice
        options:
          - main
        default: main

permissions:
  contents: write
  # 릴리스 자산에 artifact attestation을 붙이기 위해 필요하다.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # version bump 커밋은 릴리즈 스킵 (무한 루프 방지)
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        run: npm test

      # 태그에 접두어를 붙이지 않는다. 옵시디언 커뮤니티 플러그인 제출 요건은
      # 릴리스 태그가 manifest.json의 version과 **정확히 일치**할 것을 요구한다
      # (`0.7.5`, `agent-llms-0.7.5`가 아님). 접두어는 이 레포가 kiro-edition·
      # bedrock-assistant를 함께 담던 시절의 잔재이고, 지금은 플러그인이 하나뿐이다.
      - name: Resolve target branch
        id: edition
        run: |
          BRANCH="${{ steps.branch.outputs.ref }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "대상 브랜치: $BRANCH"

      - name: Bump version
        id: version
        run: |
          CURRENT=$(node -p "require('./manifest.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # 이미 릴리스된 버전인지 확인한다. manifest에 적힌 버전의 태그가 없으면
          # 그 버전을 그대로 배포한다 — bump하면 의도한 버전(예: 0.3.0)을 건너뛰고
          # 0.3.1로 나가버린다. 태그가 이미 있으면 patch를 올려 중복을 피한다.
          if git rev-parse -q --verify "refs/tags/$CURRENT" >/dev/null; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "태그 $CURRENT 이미 존재 → $NEW_VERSION 으로 증가"
          else
            NEW_VERSION="$CURRENT"
            echo "태그 $CURRENT 없음 → manifest 버전 그대로 배포"
          fi
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # 매니페스트·패키지·잠금 파일·호환성 목록의 버전을 함께 갱신한다.
          TARGET_VERSION="$NEW_VERSION" node <<'NODE'
            const fs = require('fs');
            const version = process.env.TARGET_VERSION;
            for (const file of ['manifest.json', 'package.json', 'package-lock.json']) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              data.version = version;
              if (file === 'package-lock.json') data.packages[''].version = version;
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
            }
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            versions[version] = JSON.parse(fs.readFileSync('manifest.json', 'utf8')).minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          NODE

          echo "버전 업데이트: $CURRENT → $NEW_VERSION"

      - name: Build
        run: npm run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: bump version to ${{ steps.version.outputs.new }}" && git push origin HEAD:${{ steps.edition.outputs.branch }})

      # 릴리스 자산의 출처(provenance)를 증명한다. 사용자가
      # `gh attestation verify <파일> --repo <레포>` 로 이 파일들이 이 저장소의
      # 소스에서 빌드됐음을 검증할 수 있다.
      # 버전 bump가 manifest.json을 다시 쓰므로 bump 이후에 증명해야 다이제스트가 맞는다.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.new }}
          name: "${{ steps.version.outputs.new }}"
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
